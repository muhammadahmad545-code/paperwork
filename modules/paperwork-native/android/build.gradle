plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.paperworknative'
version = '0.1.0'

android {
  namespace "expo.modules.paperworknative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Edge detection, perspective correction and cleanup, provided by Google Play services.
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
  // Text recognition with the model bundled in the APK, so it works fully offline.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
